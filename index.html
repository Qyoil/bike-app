<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울 따릉이 대여소 현황</title>
    <style>
        :root {
            --primary: #00b060;
            --primary-dark: #008f4c;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --border-color: #e1e4e8;
            --danger-bg: #ffeef0;
            --danger-border: #fdaeb7;
            --danger-text: #d73a49;
            --warning-bg: #fff8c5;
            --warning-text: #9a6700;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --primary: #00c76f;
            --primary-dark: #00a259;
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --text-sub: #8b949e;
            --border-color: #30363d;
            --danger-bg: #491f24;
            --danger-border: #f85149;
            --danger-text: #ff7b72;
            --warning-bg: #3b2e00;
            --warning-text: #d29922;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-title-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bike-logo {
            font-size: 28px;
        }

        h1 {
            font-size: 24px;
            color: var(--primary);
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle-btn, .refresh-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-toggle-btn:hover, .refresh-btn:hover {
            background-color: var(--primary-dark);
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-sample {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            border: 1px solid var(--warning-text);
        }

        .badge-live {
            background-color: #dafbe1;
            color: #116329;
            border: 1px solid #2ea043;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 176, 96, 0.15);
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 6px var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-sub);
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .station-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .station-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 3px 8px var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .station-card.empty {
            background-color: var(--danger-bg);
            border-color: var(--danger-border);
        }

        .station-name {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            word-break: keep-all;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .station-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 14px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bike-count {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
        }

        .station-card.empty .bike-count {
            color: var(--danger-text);
        }

        .empty-warning {
            margin-top: 10px;
            font-size: 12px;
            font-weight: 700;
            color: var(--danger-text);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .loading, .error-message {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            color: var(--text-sub);
            grid-column: 1 / -1;
        }

        .update-time {
            font-size: 12px;
            color: var(--text-sub);
            text-align: right;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div class="header-title-wrapper">
                    <span class="bike-logo">🚲</span>
                    <h1>서울 따릉이 대여소 현황</h1>
                </div>
                <div class="header-actions">
                    <div id="dataSourceBadge"></div>
                    <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙 다크모드</button>
                    <button class="refresh-btn" onclick="fetchBikeData()">🔄 새로고침</button>
                </div>
            </div>
            <input type="text" id="searchInput" class="search-box" placeholder="대여소 이름을 검색하세요 (예: 망원역, 합정역)..." oninput="filterStations()">
        </header>

        <div class="stats-summary" id="statsSummary"></div>

        <div class="station-grid" id="stationGrid">
            <div class="loading">데이터를 불러오는 중입니다... 🚲</div>
        </div>

        <div class="update-time" id="updateTime"></div>
    </div>

    <script>
        let allStations = [];
        let isSampleData = false;

        const SAMPLE_DATA = [{"rentBikeStatus":{"list_total_count":5,"RESULT":{"CODE":"INFO-000","MESSAGE":"정상 처리되었습니다."},"row":[{"rackTotCnt":"15","stationName":"102. 망원역 1번출구 앞","parkingBikeTotCnt":"13","shared":"87","stationLatitude":"37.55564880","stationLongitude":"126.91062927","stationId":"ST-4"},{"rackTotCnt":"14","stationName":"103. 망원역 2번출구 앞","parkingBikeTotCnt":"12","shared":"86","stationLatitude":"37.55495071","stationLongitude":"126.91083527","stationId":"ST-5"},{"rackTotCnt":"13","stationName":"104. 합정역 1번출구 앞","parkingBikeTotCnt":"17","shared":"131","stationLatitude":"37.55073929","stationLongitude":"126.91508484","stationId":"ST-6"},{"rackTotCnt":"5","stationName":"105. 합정역 5번출구 앞","parkingBikeTotCnt":"0","shared":"0","stationLatitude":"37.55000687","stationLongitude":"126.91482544","stationId":"ST-7"},{"rackTotCnt":"12","stationName":"106. 합정역 7번출구 앞","parkingBikeTotCnt":"0","shared":"0","stationLatitude":"37.54864502","stationLongitude":"126.91282654","stationId":"ST-8"}]}}];

        // 다크모드 초기화 및 토글
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('themeToggleBtn').innerText = '☀️ 라이트모드';
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const btn = document.getElementById('themeToggleBtn');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                btn.innerText = '🌙 다크모드';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                btn.innerText = '☀️ 라이트모드';
            }
        }

        async function fetchBikeData() {
            const grid = document.getElementById('stationGrid');
            grid.innerHTML = `<div class="loading">데이터를 불러오는 중입니다... 🚲</div>`;

            try {
                const response = await fetch('/api/bike');
                if (!response.ok) throw new Error('API 응답 실패');
                const data = await response.json();
                
                // 구조 분해 및 파싱
                allStations = data.rentBikeStatus.row.map(item => ({
                    stationName: item.stationName,
                    parkingBikeTotCnt: parseInt(item.parkingBikeTotCnt, 10),
                    rackTotCnt: parseInt(item.rackTotCnt, 10),
                    shared: parseInt(item.shared, 10)
                }));
                isSampleData = false;
            } catch (error) {
                console.warn('API 호출 실패, 샘플 데이터를 로드합니다.', error);
                const sampleRow = SAMPLE_DATA[0].rentBikeStatus.row;
                allStations = sampleRow.map(item => ({
                    stationName: item.stationName,
                    parkingBikeTotCnt: parseInt(item.parkingBikeTotCnt, 10),
                    rackTotCnt: parseInt(item.rackTotCnt, 10),
                    shared: parseInt(item.shared, 10)
                }));
                isSampleData = true;
            }

            updateBadge();
            filterStations();
            updateTimeDisplay();
        }

        function updateBadge() {
            const badgeContainer = document.getElementById('dataSourceBadge');
            if (isSampleData) {
                badgeContainer.innerHTML = `<span class="badge badge-sample">⚠️ 샘플 데이터</span>`;
            } else {
                badgeContainer.innerHTML = `<span class="badge badge-live">🟢 실시간 데이터</span>`;
            }
        }

        function filterStations() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allStations.filter(s => s.stationName.toLowerCase().includes(keyword));
            render(filtered);
            renderStats(filtered);
        }

        function renderStats(stations) {
            const totalStations = stations.length;
            const totalBikes = stations.reduce((acc, cur) => acc + cur.parkingBikeTotCnt, 0);
            const emptyStations = stations.filter(s => s.parkingBikeTotCnt === 0).length;

            const summaryEl = document.getElementById('statsSummary');
            summaryEl.innerHTML = `
                <div class="stat-card">
                    <span class="stat-label">조회 대여소 수</span>
                    <span class="stat-value">${totalStations}개</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">총 대여 가능 자전거</span>
                    <span class="stat-value">🚲 ${totalBikes}대</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">자전거 0대 대여소</span>
                    <span class="stat-value" style="color: var(--danger-text);">${emptyStations}개</span>
                </div>
            `;
        }

        function render(stations) {
            const grid = document.getElementById('stationGrid');
            
            if (stations.length === 0) {
                grid.innerHTML = `<div class="loading">검색 결과가 없습니다. 🔍</div>`;
                return;
            }

            grid.innerHTML = stations.map(station => {
                const isEmpty = station.parkingBikeTotCnt === 0;
                return `
                    <div class="station-card ${isEmpty ? 'empty' : ''}">
                        <div>
                            <div class="station-name">
                                <span>📍</span> ${station.stationName}
                            </div>
                            <div class="station-info">
                                <div class="info-row">
                                    <span>자전거 보유 수</span>
                                    <span class="bike-count">${station.parkingBikeTotCnt}대</span>
                                </div>
                                <div class="info-row">
                                    <span>전체 거치대</span>
                                    <span>${station.rackTotCnt}개</span>
                                </div>
                                <div class="info-row">
                                    <span>거치율</span>
                                    <span>${station.shared}%</span>
                                </div>
                            </div>
                        </div>
                        ${isEmpty ? `<div class="empty-warning">🚨 자전거가 부족합니다 (0대)</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function updateTimeDisplay() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('ko-KR');
            document.getElementById('updateTime').innerText = `마지막 갱신 시각: ${timeString}`;
        }

        // 초기 실행
        initTheme();
        fetchBikeData();
    </script>
</body>
</html>
