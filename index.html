<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울 따릉이 대여소 현황</title>
    <style>
        :root {
            --primary: #00b060;
            --primary-dark: #008f4c;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --border-color: #e1e4e8;
            --danger-bg: #ffeef0;
            --danger-border: #fdaeb7;
            --danger-text: #d73a49;
            --warning-bg: #fff8c5;
            --warning-text: #9a6700;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --primary: #00c76f;
            --primary-dark: #00a259;
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --text-sub: #8b949e;
            --border-color: #30363d;
            --danger-bg: #491f24;
            --danger-border: #f85149;
            --danger-text: #ff7b72;
            --warning-bg: #3b2e00;
            --warning-text: #d29922;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.2s, color 0.2s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bike-icon {
            font-size: 28px;
        }

        h1 {
            font-size: 22px;
            color: var(--primary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-sample {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            border: 1px solid var(--warning-text);
        }

        .badge-live {
            background-color: #dafbe1;
            color: #116329;
            border: 1px solid #2ea043;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        /* 탭 메뉴 */
        .category-tabs {
            display: flex;
            gap: 8px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            color: var(--text-sub);
            cursor: pointer;
            border-radius: 6px;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 6px var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label { font-size: 13px; color: var(--text-sub); }
        .stat-value { font-size: 20px; font-weight: bold; color: var(--primary); }

        .station-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .station-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 3px 8px var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
        }

        .station-card.empty {
            background-color: var(--danger-bg);
            border-color: var(--danger-border);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .station-name {
            font-size: 16px;
            font-weight: bold;
            word-break: keep-all;
        }

        .fav-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
        }

        .station-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 14px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
        }

        .bike-count {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
        }

        .station-card.empty .bike-count {
            color: var(--danger-text);
        }

        .empty-tag {
            color: var(--danger-text);
            font-size: 12px;
            font-weight: bold;
        }

        .card-footer {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rent-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .rent-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .update-time {
            font-size: 12px;
            color: var(--text-sub);
            text-align: right;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div class="header-title">
                    <span class="bike-icon">🚲</span>
                    <h1>서울 따릉이 대여소 현황</h1>
                </div>
                <div class="header-right">
                    <span id="badge" class="badge badge-sample">샘플 데이터</span>
                    <button class="btn" id="themeBtn" onclick="toggleTheme()">🌙 다크모드</button>
                    <button class="btn" onclick="init()">🔄 새로고침</button>
                </div>
            </div>

            <!-- 카테고리 탭 -->
            <div class="category-tabs">
                <button class="tab-btn active" onclick="switchCategory('all', this)">📋 전체 목록</button>
                <button class="tab-btn" onclick="switchCategory('fav', this)">⭐ 즐겨찾기</button>
                <button class="tab-btn" onclick="switchCategory('frequent', this)">🔥 자주 빌린 곳</button>
            </div>

            <input type="text" id="searchInput" class="search-box" placeholder="대여소 이름을 검색하세요..." oninput="filterStations()">
        </header>

        <div class="stats-summary" id="stats"></div>
        <div class="station-grid" id="grid"></div>
        <div class="update-time" id="updateTime"></div>
    </div>

    <script>
        const SAMPLE = [{"rentBikeStatus":{"list_total_count":5,"RESULT":{"CODE":"INFO-000","MESSAGE":"정상 처리되었습니다."},"row":[{"rackTotCnt":"15","stationName":"102. 망원역 1번출구 앞","parkingBikeTotCnt":"13","shared":"87","stationLatitude":"37.55564880","stationLongitude":"126.91062927","stationId":"ST-4"},{"rackTotCnt":"14","stationName":"103. 망원역 2번출구 앞","parkingBikeTotCnt":"12","shared":"86","stationLatitude":"37.55495071","stationLongitude":"126.91083527","stationId":"ST-5"},{"rackTotCnt":"13","stationName":"104. 합정역 1번출구 앞","parkingBikeTotCnt":"17","shared":"131","stationLatitude":"37.55073929","stationLongitude":"126.91508484","stationId":"ST-6"},{"rackTotCnt":"5","stationName":"105. 합정역 5번출구 앞","parkingBikeTotCnt":"0","shared":"0","stationLatitude":"37.55000687","stationLongitude":"126.91482544","stationId":"ST-7"},{"rackTotCnt":"12","stationName":"106. 합정역 7번출구 앞","parkingBikeTotCnt":"0","shared":"0","stationLatitude":"37.54864502","stationLongitude":"126.91282654","stationId":"ST-8"}]}}];

        let stationsData = [];
        let currentCategory = 'all';
        let favorites = JSON.parse(localStorage.getItem('fav_stations') || '[]');
        let rentHistory = JSON.parse(localStorage.getItem('rent_history') || '{}');

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                document.getElementById('themeBtn').innerText = '🌙 다크모드';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('themeBtn').innerText = '☀️ 라이트모드';
            }
        }

        function parseData(row) {
            return row.map(item => ({
                stationName: item.stationName,
                parkingBikeTotCnt: parseInt(item.parkingBikeTotCnt, 10) || 0,
                rackTotCnt: parseInt(item.rackTotCnt, 10) || 0,
                shared: parseInt(item.shared, 10) || 0
            }));
        }

        function switchCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterStations();
        }

        function toggleFav(name) {
            if (favorites.includes(name)) {
                favorites = favorites.filter(n => n !== name);
            } else {
                favorites.push(name);
            }
            localStorage.setItem('fav_stations', JSON.stringify(favorites));
            filterStations();
        }

        function rentBike(name) {
            rentHistory[name] = (rentHistory[name] || 0) + 1;
            localStorage.setItem('rent_history', JSON.stringify(rentHistory));
            alert(`[${name}] 대여가 기록되었습니다! 🚲`);
            filterStations();
        }

        function filterStations() {
            const kw = document.getElementById('searchInput').value.toLowerCase();
            let list = [...stationsData];

            if (currentCategory === 'fav') {
                list = list.filter(s => favorites.includes(s.stationName));
            } else if (currentCategory === 'frequent') {
                list = list.filter(s => (rentHistory[s.stationName] || 0) > 0)
                            .sort((a, b) => (rentHistory[b.stationName] || 0) - (rentHistory[a.stationName] || 0));
            }

            const filtered = list.filter(s => s.stationName.toLowerCase().includes(kw));
            render(filtered);
            renderStats(filtered);
        }

        function renderStats(list) {
            const stats = document.getElementById('stats');
            const total = list.length;
            const bikes = list.reduce((sum, s) => sum + s.parkingBikeTotCnt, 0);
            const empty = list.filter(s => s.parkingBikeTotCnt === 0).length;

            stats.innerHTML = `
                <div class="stat-card">
                    <span class="stat-label">조회 대여소 수</span>
                    <span class="stat-value">${total}개</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">총 대여 가능 자전거</span>
                    <span class="stat-value">🚲 ${bikes}대</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">자전거 0대 대여소</span>
                    <span class="stat-value" style="color:var(--danger-text);">${empty}개</span>
                </div>
            `;
        }

        function render(list) {
            const grid = document.getElementById('grid');

            if (list.length === 0) {
                let msg = "검색 결과가 없습니다. 🔍";
                if (currentCategory === 'fav') msg = "등록된 즐겨찾기 대여소가 없습니다. ⭐를 눌러 추가해보세요!";
                if (currentCategory === 'frequent') msg = "아직 대여 기록이 있는 대여소가 없습니다. 🚲";
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--text-sub);">${msg}</div>`;
                return;
            }

            grid.innerHTML = list.map(s => {
                const isEmpty = s.parkingBikeTotCnt === 0;
                const isFav = favorites.includes(s.stationName);
                const count = rentHistory[s.stationName] || 0;

                return `
                    <div class="station-card ${isEmpty ? 'empty' : ''}">
                        <div>
                            <div class="card-top">
                                <div class="station-name">📍 ${s.stationName}</div>
                                <button class="fav-btn" onclick="toggleFav('${s.stationName}')">${isFav ? '⭐' : '☆'}</button>
                            </div>
                            <div class="station-info" style="margin-top:8px;">
                                <div class="info-row">
                                    <span>자전거 수</span>
                                    <span class="bike-count">${s.parkingBikeTotCnt}대</span>
                                </div>
                                <div class="info-row">
                                    <span>거치대 수</span>
                                    <span>${s.rackTotCnt}개</span>
                                </div>
                                <div class="info-row">
                                    <span>거치율</span>
                                    <span>${s.shared}%</span>
                                </div>
                            </div>
                        </div>

                        <div>
                            ${isEmpty ? `<div class="empty-tag" style="margin-bottom:6px;">🚨 자전거 없음 (0대)</div>` : ''}
                            <div class="card-footer">
                                <span style="font-size:11px; color:var(--text-sub);">이용 횟수: ${count}회</span>
                                <button class="rent-btn" ${isEmpty ? 'disabled' : ''} onclick="rentBike('${s.stationName}')">🚲 대여하기</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function init() {
            const badge = document.getElementById('badge');
            
            fetch('/api/bike')
                .then(res => {
                    if (!res.ok) throw new Error();
                    return res.json();
                })
                .then(data => {
                    if (data && data.rentBikeStatus && data.rentBikeStatus.row) {
                        stationsData = parseData(data.rentBikeStatus.row);
                        badge.className = 'badge badge-live';
                        badge.innerText = '실시간 데이터';
                    } else {
                        throw new Error();
                    }
                })
                .catch(() => {
                    stationsData = parseData(SAMPLE[0].rentBikeStatus.row);
                    badge.className = 'badge badge-sample';
                    badge.innerText = '샘플 데이터';
                })
                .finally(() => {
                    filterStations();
                    document.getElementById('updateTime').innerText = `마지막 갱신 시각: ${new Date().toLocaleTimeString('ko-KR')}`;
                });
        }

        init();
    </script>
</body>
</html>
