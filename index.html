<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울 따릉이 대여소 현황</title>
    <style>
        :root {
            --primary: #00b060;
            --primary-dark: #008f4c;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --border-color: #e1e4e8;
            --danger-bg: #ffeef0;
            --danger-border: #fdaeb7;
            --danger-text: #d73a49;
            --warning-bg: #fff8c5;
            --warning-text: #9a6700;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --primary: #00c76f;
            --primary-dark: #00a259;
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --text-sub: #8b949e;
            --border-color: #30363d;
            --danger-bg: #491f24;
            --danger-border: #f85149;
            --danger-text: #ff7b72;
            --warning-bg: #3b2e00;
            --warning-text: #d29922;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.2s, color 0.2s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bike-icon {
            font-size: 28px;
        }

        h1 {
            font-size: 22px;
            color: var(--primary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-sample {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            border: 1px solid var(--warning-text);
        }

        .badge-live {
            background-color: #dafbe1;
            color: #116329;
            border: 1px solid #2ea043;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 6px var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label { font-size: 13px; color: var(--text-sub); }
        .stat-value { font-size: 20px; font-weight: bold; color: var(--primary); }

        .station-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .station-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 3px 8px var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .station-card.empty {
            background-color: var(--danger-bg);
            border-color: var(--danger-border);
        }

        .station-name {
            font-size: 16px;
            font-weight: bold;
            word-break: keep-all;
        }

        .station-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 14px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
        }

        .bike-count {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
        }

        .station-card.empty .bike-count {
            color: var(--danger-text);
        }

        .empty-tag {
            color: var(--danger-text);
            font-size: 12px;
            font-weight: bold;
            margin-top: 4px;
        }

        .update-time {
            font-size: 12px;
            color: var(--text-sub);
            text-align: right;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div class="header-title">
                    <span class="bike-icon">🚲</span>
                    <h1>서울 따릉이 대여소 현황</h1>
                </div>
                <div class="header-right">
                    <span id="badge" class="badge badge-sample">샘플 데이터</span>
                    <button class="btn" id="themeBtn" onclick="toggleTheme()">🌙 다크모드</button>
                    <button class="btn" onclick="init()">🔄 새로고침</button>
                </div>
            </div>
            <input type="text" id="searchInput" class="search-box" placeholder="대여소 이름을 검색하세요..." oninput="onSearch()">
        </header>

        <div class="stats-summary" id="stats"></div>
        <div class="station-grid" id="grid
