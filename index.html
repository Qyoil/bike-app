<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울 따릉이 대여소 현황</title>
    <style>
        :root {
            --primary: #00b060;
            --primary-dark: #008f4c;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --border-color: #e1e4e8;
            --danger-bg: #ffeef0;
            --danger-border: #fdaeb7;
            --danger-text: #d73a49;
            --warning-bg: #fff8c5;
            --warning-text: #9a6700;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --primary: #00c76f;
            --primary-dark: #00a259;
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --text-sub: #8b949e;
            --border-color: #30363d;
            --danger-bg: #491f24;
            --danger-border: #f85149;
            --danger-text: #ff7b72;
            --warning-bg: #3b2e00;
            --warning-text: #d29922;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-title-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bike-logo {
            font-size: 28px;
        }

        h1 {
            font-size: 24px;
            color: var(--primary);
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle-btn, .refresh-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-toggle-btn:hover, .refresh-btn:hover {
            background-color: var(--primary-dark);
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-sample {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            border: 1px solid var(--warning-text);
        }

        .badge-live {
            background-color: #dafbe1;
            color: #116329;
            border: 1px solid #2ea043;
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            border-radius: 6px;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 176, 96, 0.15);
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 6px var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-sub);
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .station-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .station-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 3px 8px var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .station-card.empty {
            background-color: var(--danger-bg);
            border-color: var(--danger-border);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .station-name {
            font-size: 16px;
            font-weight: 700;
            word-break: keep-all;
            padding-right: 8px;
        }

        .fav-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
        }

        .station-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 14px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bike-count {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
        }

        .station-card.empty .bike-count {
            color: var(--danger-text);
        }

        .card-footer {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rent-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .rent-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .rent-count-tag {
            font-size: 12px;
            color: var(--text-sub);
        }

        .empty-warning {
            margin-top: 10px;
            font-size: 12px;
            font-weight: 700;
            color: var(--danger-text);
        }

        .loading, .empty-msg {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            color: var(--text-sub);
            grid-column: 1 / -1;
        }

        .update-time {
            font-size: 12px;
            color: var(--text-sub);
            text-align: right;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div class="header-title-wrapper">
                    <span class="bike-logo">🚲</span>
                    <h1>서울 따릉이 대여소 현황</h1>
                </div>
                <div class="header-actions">
                    <div id="dataSourceBadge"></div>
                    <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙 다크모드</button>
                    <button class="refresh-btn" onclick="fetchBikeData()">🔄 새로고침</button>
                </div>
            </div>

            <div class="category-tabs">
                <button class="tab-btn active" onclick="switchCategory('all', this)">📋 전체 목록</button>
                <button class="tab-btn" onclick="switchCategory('fav', this)">⭐ 즐겨찾기</button>
                <button class="tab-btn" onclick="switchCategory('frequent', this)">🔥 자주 빌린 곳</button>
            </div>

            <input type="text" id="searchInput" class="search-box" placeholder="대여소 이름을 검색하세요..." oninput="filterStations()">
        </header>

        <div class="stats-summary" id="statsSummary"></div>

        <div class="station-grid" id="stationGrid">
            <div class="loading">데이터를 불러오는 중입니다... 🚲</div>
        </div>

        <div class="update-time" id="updateTime"></div>
    </div>
